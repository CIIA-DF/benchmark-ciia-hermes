# Sandbox de desenvolvimento da team/backend (Codespaces ou Docker Desktop).
# Isolado do infra/compose.yml: nome de projeto próprio, banco descartável e sem portas publicadas
# no host. O PostgreSQL só é alcançável pela rede interna deste projeto.
name: ciia-backend-sandbox
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/benchmark-ciia-hermes:cached
      # .venv e node_modules ficam em volumes: não misturam binários Windows/Linux com o host.
      - venv:/workspaces/benchmark-ciia-hermes/.venv
      - portal_node_modules:/workspaces/benchmark-ciia-hermes/portal/node_modules
    environment:
      DATABASE_URL: postgresql+psycopg://benchmark@db:5432/benchmark
      TEST_DATABASE_URL: postgresql+psycopg://benchmark@db:5432/benchmark_test
      UV_LINK_MODE: copy
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_DB: benchmark
      # Sem senha: o banco é sintético, descartável e não sai da rede interna do sandbox.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U benchmark -d benchmark]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  venv:
  portal_node_modules:
  pgdata:
