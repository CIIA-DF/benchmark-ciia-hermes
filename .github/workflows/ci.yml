name: CI
on:
  pull_request:
  push:
    branches: [main, production, 'team/**']
  workflow_dispatch:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.13'
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.dev check
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: ci-only-synthetic
          POSTGRES_DB: benchmark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U benchmark -d benchmark_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://benchmark:ci-only-synthetic@localhost:5432/benchmark_test
      DATABASE_URL: postgresql+psycopg://benchmark:ci-only-synthetic@localhost:5432/benchmark_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.13'
      - run: uv sync --locked
      - run: uv run --locked python -m scripts.dev test-integration
      - run: uv run --locked python -m scripts.dev demo
