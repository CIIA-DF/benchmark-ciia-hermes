events {}
http {
    access_log off;
    server {
        listen 8080;
        location / {
            proxy_pass http://portal:3000;
            proxy_set_header Host $http_host;
        }
        location /api/chat/ {
            proxy_pass http://portal:3000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 360s;
        }
    }
}
