        '409':
          description: Conflito de estado, idempotência, versão ou orçamento (`conflict`, `idempotency_conflict`,
            `version_mismatch`, `budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '429':
          description: Quota atingida (`resource_limit`); consulte retryable e o snapshot antes de repetir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Saída inválida (`invalid_response`) ou falha interna (`internal_error`), sem detalhes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /runs:
    post:
      tags:
      - Execuções
      summary: Enfileira execução de benchmark, sem memória de chat
      description: Limite padrão de 20 runs queued por operador, contando todos os seus processos, corpus
        e executores. Configurável por RUN_MAX_QUEUED_PER_OPERATOR. Replay da mesma chave/entrada precede
        a quota; entrada diferente mantém 409. Fila cheia retorna 429 resource_limit, sem criar run ou
        evento. Queued vencido é expirado antes da quota, sem exigir GET prévio.
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInput'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência, versão ou orçamento (`conflict`, `idempotency_conflict`,
            `version_mismatch`, `budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '429':
          description: Quota atingida (`resource_limit`); consulte retryable e o snapshot antes de repetir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Saída inválida (`invalid_response`) ou falha interna (`internal_error`), sem detalhes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /runs/claim:
    post:
      tags:
      - Worker
      summary: Reserva a próxima execução do executor
      description: Devolve `run_token`, que deve ir no cabeçalho `X-Run-Token` das tools, eventos, heartbeat
        e resultado. Queued vencido não é entregue; a expiração é revalidada sob a trava antes de atribuir
        o worker. Polling autorizado registra presença observada, inclusive quando retorna 204 sem trabalho.
      operationId: claimRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedRun'
        '204':
          description: Sem tarefa
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
