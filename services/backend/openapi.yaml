          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Falha interna (internal_error) ou saída inválida (invalid_response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
