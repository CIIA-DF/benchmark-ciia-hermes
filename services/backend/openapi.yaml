openapi: 3.1.0
info:
  title: CIIA — tools e conversas experimentais
  version: 0.3.0
paths:
  /health:
    get:
      tags:
      - Saúde
      summary: Verifica API e banco
      description: Executa SELECT 1 no banco configurado. 200 confirma essa consulta; falha SQL retorna
        503 storage_unavailable. Não verifica schema completo, fila, workers, modelos ou inferência de
        LLM.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Falha interna (internal_error) ou saída inválida (invalid_response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security: []
  /ready:
    get:
      tags:
      - Saúde
      summary: Verifica se o schema do banco está na revisão esperada
      description: Compara a revisão Alembic aplicada com a head do código, sem migrar. Diferença ou banco
        sem controle de versão retorna 503 storage_unavailable retryable (por exemplo, migração ainda
        em curso). `/health` continua só testando a conexão. Não verifica fila, workers, modelos ou inferência.
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Falha interna (internal_error) ou saída inválida (invalid_response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /capabilities:
    get:
      tags:
      - Operador
      summary: Configuração dos executores, presença observada e permissão de escrita
      description: available mantém o significado legado de configuração habilitada, igual a enabled.
        worker_recent indica polling/heartbeat autorizado nos últimos 60 s, em escopo concedido ao operador.
        Não comprova inferência. Modelo remoto desconhecido é null e configuration_known é false; não
        são inferidos do ambiente da API.
      operationId: capabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Falha interna (internal_error) ou saída inválida (invalid_response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /processos:
    get:
      tags:
      - Operador
      summary: Processos e corpus concedidos ao operador
      description: Lista vazia autorizada retorna 200. Payload persistido deve ser válido e corresponder
        à identidade da linha concedida; inconsistência retorna 500 invalid_response seguro, sem lista
        parcial.
      operationId: listProcesses
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Process'
                type: array
                title: Response Listprocesses
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Saída inválida (`invalid_response`) ou falha interna (`internal_error`), sem detalhes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /conversations:
    post:
      tags:
      - Conversas
      summary: Cria conversa fixando processo, corpus, requisitos e executor
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência, versão ou orçamento (`conflict`, `idempotency_conflict`,
            `version_mismatch`, `budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Saída inválida (`invalid_response`) ou falha interna (`internal_error`), sem detalhes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
    get:
      tags:
      - Conversas
      summary: Lista conversas do operador; filtro de participante não concede acesso
      operationId: listConversations
      parameters:
      - name: participant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Participant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'
                title: Response Listconversations
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '500':
          description: Falha interna (internal_error) ou saída inválida (invalid_response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /conversations/{conversation_id}:
    get:
      tags:
      - Conversas
      summary: Conversa com mensagens e execuções
      operationId: getConversation
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
