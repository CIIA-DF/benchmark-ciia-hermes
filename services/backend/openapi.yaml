components:
  schemas:
    AgentEvent:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
        kind:
          type: string
          enum:
          - status
          - text_delta
          title: Kind
        text:
          type: string
          maxLength: 4000
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - event_id
      - kind
      - text
      title: AgentEvent
    AgentResult:
      properties:
        status:
          type: string
          enum:
          - succeeded
          - failed
          - timed_out
          title: Status
        answer:
          type: string
          maxLength: 100000
          title: Answer
          default: ''
        sources:
          items:
            anyOf:
            - $ref: '#/components/schemas/Evidence'
