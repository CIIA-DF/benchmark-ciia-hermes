components:
  schemas:
    AgentEvent:
      properties:
        event_id:
          type: string
          format: uuid
          title: Event Id
        kind:
          type: string
          enum:
          - status
          - text_delta
          title: Kind
        text:
          type: string
          maxLength: 4000
          minLength: 1
          pattern: ^[^\x00]+$
          title: Text
      additionalProperties: false
      type: object
      required:
      - event_id
      - kind
      - text
      title: AgentEvent
      description: Evento do adaptador; deltas preservam espaços e quebras de linha.
    AgentResult:
      properties:
        status:
          type: string
          enum:
          - succeeded
          - failed
          - timed_out
          title: Status
        answer:
          type: string
          maxLength: 100000
          pattern: ^[^\x00]*$
          title: Answer
          default: ''
        sources:
          items:
            anyOf:
            - $ref: '#/components/schemas/Evidence'
            - $ref: '#/components/schemas/InventoryEvidence'
          type: array
          maxItems: 100
          title: Sources
        error_code:
          anyOf:
          - type: string
            enum:
            - adapter_error
            - context_limit
            - model_timeout
          - type: 'null'
          title: Error Code
        experiment:
          anyOf:
          - $ref: '#/components/schemas/ExperimentRun'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - status
      title: AgentResult
      description: Resultado declarado pelo adaptador e fontes a validar pelo servidor.
    ArtifactResponse:
      properties:
