openapi: 3.1.0
info:
  title: CIIA — tools e conversas experimentais
  version: 0.2.0
paths:
  /health:
    get:
      tags:
      - Saúde
      summary: Verifica API e banco
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  status:
                    const: ok
                  contract_version:
                    type: string
                    examples:
                    - '0.2'
                type: object
                required:
                - status
                - contract_version
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security: []
  /capabilities:
    get:
      tags:
      - Operador
      summary: Executores disponíveis e permissão de escrita do operador
      operationId: capabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /processos:
    get:
      tags:
      - Operador
      summary: Processos e corpus concedidos ao operador
      operationId: listProcesses
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Process'
                type: array
                title: Response Listprocesses
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /conversations:
    post:
      tags:
      - Conversas
      summary: Cria conversa fixando processo, corpus, requisitos e executor
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
    get:
      tags:
      - Conversas
      summary: Lista conversas do operador; filtro de participante não concede acesso
      operationId: listConversations
      parameters:
      - name: participant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Participant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'
                title: Response Listconversations
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /conversations/{conversation_id}:
    get:
      tags:
      - Conversas
      summary: Conversa com mensagens e execuções
      operationId: getConversation
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /conversations/{conversation_id}/messages:
    post:
      tags:
      - Conversas
      summary: Envia mensagem e enfileira execução de chat
      description: Repetir a mesma `idempotency_key` com a mesma entrada devolve o run existente. Só um
        run ativo por conversa; outro envio recebe 409 `conflict`.
      operationId: sendMessage
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /runs:
    post:
      tags:
      - Execuções
      summary: Enfileira execução de benchmark, sem memória de chat
      operationId: createRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInput'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /runs/claim:
    post:
      tags:
      - Worker
      summary: Reserva a próxima execução do executor
      description: Devolve `run_token`, que deve ir no cabeçalho `X-Run-Token` das tools, eventos, heartbeat
        e resultado.
      operationId: claimRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimedRun'
        '204':
          description: Sem tarefa
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /runs/{run_id}:
    get:
      tags:
      - Execuções
      summary: Snapshot consistente de status, texto parcial e cursor
      operationId: getRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /runs/{run_id}/heartbeat:
    post:
      tags:
      - Worker
      summary: Renova a reserva da execução
      operationId: heartbeat
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
        RunToken: []
  /runs/{run_id}/events:
    post:
      tags:
      - Worker
      summary: Publica status ou trecho de resposta; idempotente por event_id
      operationId: publishEvent
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEvent'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
        RunToken: []
    get:
      tags:
      - Execuções
      summary: Fluxo SSE de eventos persistidos
      description: Eventos `status`, `text_delta`, `tool` e `done`, cada um com `id` igual à sequência.
        O cabeçalho `Last-Event-ID` tem precedência sobre `after`. Falhas após o início do fluxo chegam
        como evento `stream_error` com `message` e `code`. O fluxo termina após o evento `done`.
      operationId: streamEvents
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: After
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
        description: Última sequência recebida; substitui `after`.
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: 3

                event: text_delta

                data: {"text": "Resposta parcial"}


                id: 4

                event: done

                data: {"status": "succeeded"}


                '
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /runs/{run_id}/result:
    post:
      tags:
      - Worker
      summary: Encerra a execução com resultado final
      description: Com sucesso, `answer` deve coincidir com a concatenação dos `text_delta`. Benchmark
        bem-sucedido exige `experiment`. Repetir o mesmo resultado é idempotente.
      operationId: finishRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentResult'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
        RunToken: []
  /artifacts/{artifact_id}:
    get:
      tags:
      - Artefatos
      summary: Artefato gravado e recibo, para conferência pelo operador
      operationId: getArtifact
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
  /tools/consultar_processo:
    post:
      tags:
      - Tools
      summary: Metadados, inventário e cobertura da exportação
      operationId: consultarProcesso
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolContext'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResult'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
      security:
      - BearerAuth: []
        RunToken: []
  /tools/buscar_documentos:
    post:
      tags:
      - Tools
      summary: Busca literal de trechos com fonte
      description: Lista vazia não prova ausência no processo original.
      operationId: buscarDocumentos
      requestBody:
        content:
          application/json:
            schema:
