              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '409':
          description: Conflito de estado, idempotência, versão ou orçamento (`conflict`, `idempotency_conflict`,
            `version_mismatch`, `budget_exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '429':
          description: Quota atingida (`resource_limit`); consulte retryable e o snapshot antes de repetir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '500':
          description: Saída inválida (`invalid_response`) ou falha interna (`internal_error`), sem detalhes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '413':
          description: Corpo acima de 1 MiB (payload_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
            X-Tool-Call-Id:
              schema:
                type: string
                pattern: ^[A-Za-z0-9_.:-]{1,120}$
              description: ID efetivo da chamada lógica; ausente quando o valor enviado é inválido.
      security:
      - BearerAuth: []
        RunToken: []
      parameters:
      - name: X-Tool-Call-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,120}$
        description: ID da chamada lógica, repetido nas retentativas; ausente, o servidor gera. A resposta
          devolve o ID efetivo no cabeçalho `X-Tool-Call-Id` (exceto quando o valor enviado é inválido).
          Correlaciona o histórico de tentativas com `ExperimentRun.tool_calls`.
  /tools/salvar_minuta:
    post:
      tags:
      - Tools
      summary: Persiste minuta fundamentada e devolve recibo
      description: Mesma regra de idempotência de `registrar_pendencia`. Teto de 1.000 requisições físicas
