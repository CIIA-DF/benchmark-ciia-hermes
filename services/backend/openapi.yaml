          type: array
          maxItems: 100
          title: Sources
        error_code:
          anyOf:
          - type: string
            enum:
            - adapter_error
            - context_limit
            - model_timeout
          - type: 'null'
          title: Error Code
        experiment:
          anyOf:
          - $ref: '#/components/schemas/ExperimentRun'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - status
      title: AgentResult
    ArtifactResponse:
      properties:
        artifact_id:
          type: string
          format: uuid
