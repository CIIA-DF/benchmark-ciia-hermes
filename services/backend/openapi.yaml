        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '409':
          description: Conflito de estado, idempotência ou versão (`conflict`, `idempotency_conflict`,
            `version_mismatch`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
          description: Entrada inválida ou limite excedido (`validation_error`, `context_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '503':
          description: Banco ou executor indisponível (`storage_unavailable`, `executor_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
