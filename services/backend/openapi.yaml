          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '405':
          description: Método não permitido (method_not_allowed); preserva Allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /conversations/{conversation_id}/messages:
    post:
      tags:
      - Conversas
      summary: Envia mensagem e enfileira execução de chat
      description: Repetir a mesma `idempotency_key` com a mesma entrada devolve o run existente antes
        da quota. Só um run ativo por conversa; outro envio recebe 409 `conflict`. Compartilha com POST
        /runs o limite de queued por operador, padrão 20, configurável por RUN_MAX_QUEUED_PER_OPERATOR.
        Fila cheia retorna 429 `resource_limit`, sem gravar mensagem, run ou evento. Gravação dos três
        é atômica.
      operationId: sendMessage
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
