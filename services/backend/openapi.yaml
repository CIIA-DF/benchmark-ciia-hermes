          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            Allow:
              schema:
                type: string
      security:
      - BearerAuth: []
  /runs/{run_id}:
    get:
      tags:
      - Execuções
      summary: Snapshot consistente de status, texto parcial e cursor
      description: Queued expira após 300 s desde created_at, configuráveis por RUN_QUEUE_TIMEOUT_SECONDS.
        Retorna timed_out com result.error_code queue_timeout, preservando histórico, parciais e artefatos.
        A regra também vale em criação e claim.
      operationId: getRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '401':
          description: Credencial ausente ou inválida (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
        '403':
          description: Perfil, concessão de processo/corpus, reserva ou contexto incompatível (`forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '404':
          description: Recurso inexistente ou fora do alcance do perfil (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolError'
        '422':
